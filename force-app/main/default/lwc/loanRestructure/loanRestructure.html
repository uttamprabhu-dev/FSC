<template>
    <div class="loan-container">
        <template if:true={step1}>
            <div class="step-container">
                <h1 class="step-header">My Loans</h1>
                <div class="loan-grid">
                    <template for:each={loanOptions} for:item="loan" for:index="index">
                        <div key={loan.id} class={loan.isSelected} onclick={handleSelectLoan} data-index={index}
                            onmouseenter={handleTileHover} onmouseleave={handleTileHoverOut}>
                            <p class="loan-tile-title">{loan.loanAccount}</p>
                            <p class="loan-tile-detail"><strong>Loan Amount:</strong> INR {loan.totalLoanAmount}</p>
                            <p class="loan-tile-detail"><strong>Term:</strong> {loan.loanTerm} months</p>
                            <p class="loan-tile-detail"><strong>Due Amount:</strong> INR {loan.currentDueAmount}</p>
                            <p class="loan-tile-detail"><strong>Interest Rate:</strong> {loan.interestRate}%</p>
                            <p class="loan-tile-detail"><strong>Interest Amount:</strong> INR {loan.interestAmount}</p>
                        </div>
                    </template>
                </div>
                <template lwc:if={chosenLoanOption}>
                    <button type="button" onclick={handleNext} class="select-loan-btn">Next</button>
                </template>
            </div>
        </template>
        <template if:true={step2}>
            <template if:true={chosenLoanOption}>
                <div class="step-container">
                    <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 10px;">
                        <lightning-button-icon icon-class="" icon-name="utility:back" alternative-text="Previous"
                            class="" name="Go back" size="large" title="Go back" tooltip="Go back" type="button"
                            value="" variant="bare" onclick={handleBack}></lightning-button-icon>
                        <h1 class="step-header">Loan Restructuring</h1>
                    </div>

                    <div class="loan-details">
                        <div class="form-section-title">Selected Loan Details</div>
                        <div class="detail-row">
                            <span class="detail-label">Loan Account</span>
                            <span class="detail-value">{chosenLoanOption.loanAccount}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Total Loan Amount</span>
                            <span class="detail-value">INR {chosenLoanOption.totalLoanAmount}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Loan Term</span>
                            <span class="detail-value">{chosenLoanOption.loanTerm} months</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Current Due Amount</span>
                            <span class="detail-value">INR {chosenLoanOption.currentDueAmount}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Interest Rate</span>
                            <span class="detail-value">{chosenLoanOption.interestRate}%</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Interest Amount</span>
                            <span class="detail-value">INR {chosenLoanOption.interestAmount}</span>
                        </div>
                    </div>

                    <div class="form-section">
                        <div class="form-section-title">Choose New Tenure</div>
                        <div class="form-group">
                            <label class="form-label" for="tenureSelect">Select Tenure Option</label>
                            <select id="tenureSelect" class="form-select" onchange={handleTenureChange}>
                                <option value="">Select tenure</option>
                                <option value="1">1 year</option>
                                <option value="2">2 years</option>
                                <option value="3-month">3-month moratorium</option>
                            </select>
                        </div>
                    </div>

                    <template lwc:if={updatedTenureLoanDetails}>
                        <div class="updated-details">
                            <div class="form-section-title">Updated Loan Details</div>
                            <div class="detail-row">
                                <span class="detail-label">New Tenure</span>
                                <span class="detail-value">{updatedTenureLoanDetails.tenure}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">New Monthly EMI</span>
                                <span class="detail-value">INR {updatedTenureLoanDetails.monthlyEmi}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Total Interest Payable</span>
                                <span class="detail-value">INR {updatedTenureLoanDetails.totalInterest}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Total Amount Payable</span>
                                <span class="detail-value">INR {updatedTenureLoanDetails.totalPayable}</span>
                            </div>
                        </div>

                        <div class="button-section">
                            <lightning-button variant="brand" label="Confirm"
                                onclick={handleLoanRestructure}></lightning-button>
                        </div>
                    </template>
                </div>
            </template>
        </template>
        <template if:true={loandChangeResult}>
            <div class="result-message">
                {loandChangeResult}
            </div>
        </template>
    </div>
</template>
